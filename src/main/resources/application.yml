spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
  sql:
    init:
      mode: never
server:
  address: ${INGESTION_HTTP_ADDRESS:127.0.0.1}
  port: ${INGESTION_HTTP_PORT}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
ingestion:
  github-machine:
    enabled: false
  github-webhook:
    enabled: false
  publication-worker:
    enabled: false
  capture:
    enabled: false
  messaging:
    enabled: false
  protection:
    enabled: false
logging:
  level:
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.orm.jdbc.warn: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
