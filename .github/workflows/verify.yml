name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile, test with isolated PostgreSQL and package
        run: ./mvnw -B -ntp clean verify
      - name: Build local non-root image
        run: |
          docker build --build-arg "VCS_REF=$GITHUB_SHA" --tag ingestion:verify .
          test "$(docker image inspect ingestion:verify --format '{{.Config.User}}')" = '10001:10001'
